# Se automatizara con Chrome
webdriver.driver = chrome
webdriver.chrome.driver = drivers/chromedriver.exe
webdriver.autodownload=false

# Configuraciones de Serenity
serenity.browser.maximized=true
serenity.take.screenshots = FOR_EACH_ACTION

# Configuración de tiempos
webdriver.timeouts.implicitlywait = 10000

# Switches de Chrome
chrome.switches = --start-maximized --disable-popup-blocking

# Carpeta base donde se guardan los reportes
serenity.outputDirectory = target/serenity-reports
# Carpeta para screenshots